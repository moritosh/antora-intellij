# Push a tag like v0.1.0 to publish the plugin zip as a GitHub release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against pluginVersion
        id: versions
        run: |
          version=$(sed -n 's/^pluginVersion=//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match pluginVersion=$version in gradle.properties"
            exit 1
          fi
          echo "antora-ls=v$(sed -n 's/^antoraLsVersion=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      # The preview server, from the antora-ls release that gradle.properties names.
      - uses: actions/checkout@v7
        with:
          repository: moritosh/antora-ls
          ref: ${{ steps.versions.outputs.antora-ls }}
          path: antora-ls
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test buildPlugin -PantoraPreviewScript=antora-ls/preview/antora-preview.js
      - uses: softprops/action-gh-release@v3
        with:
          files: build/distributions/antora-intellij-*.zip
